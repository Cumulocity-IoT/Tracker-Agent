name: Java Microservice Build & Release

on:
  push:
    tags:
      - '*'   # Trigger on any tag creation

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    # Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Set up JDK 26 + Maven cache
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '26'
        cache: maven

    # Build & run tests
    - name: Build and run tests
      run: |
        if [ -f "./mvnw" ]; then
          ./mvnw clean verify --batch-mode
        else
          mvn clean verify --batch-mode
        fi

    # Extract version from tag
    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

    # Build Docker image
    - name: Build Docker image
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        docker build -t tcp-agent:${VERSION} \
          -f target/docker-work/Dockerfile target/docker-work

        docker save tcp-agent:${VERSION} \
          -o target/tcp-agent-${VERSION}.tar

    # Rename build artifacts consistently
    - name: Prepare artifacts
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}

        for f in target/*.jar; do
          mv "$f" "target/tcp-agent-${VERSION}.jar" || true
        done

        for f in target/*.zip; do
          mv "$f" "target/tcp-agent-${VERSION}.zip" || true
        done

    # Upload build artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tcp-agent-${{ steps.version.outputs.VERSION }}
        path: |
          target/tcp-agent-${{ steps.version.outputs.VERSION }}.jar
          target/tcp-agent-${{ steps.version.outputs.VERSION }}.zip
          target/tcp-agent-${{ steps.version.outputs.VERSION }}.tar

    # Upload test reports
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/surefire-reports/*.xml

    # Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Release ${{ steps.version.outputs.VERSION }}
        body: "Automated release for tcp-agent ${{ steps.version.outputs.VERSION }}"
        files: |
          target/tcp-agent-${{ steps.version.outputs.VERSION }}.jar
          target/tcp-agent-${{ steps.version.outputs.VERSION }}.zip
          target/tcp-agent-${{ steps.version.outputs.VERSION }}.tar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}